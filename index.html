<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Information System<h1>
    </header>
    <div class="add-student">
        <button onclick="showAddStudentForm()" id="addStudent">Add Student</button>
    </div>
    <div id="formContainer" style="display: none;">
        <form id="studentForm">
            <input type="hidden" id="studentId">
            <input type="text" id="studentName" placeholder="Name" required>
            <input type="text" id="studentNumber" placeholder="Student Number" required>
            <input type="text" id="studentProgram" placeholder="Program" required>
            <button type="button" onclick="submitStudentForm()">Submit</button>
            <button type="button" onclick="hideForm()">Cancel</button>
        </form>
    </div>
    <div id="response"></div>
    <table id="studentsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Student Number</th>
                <th>Program</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
