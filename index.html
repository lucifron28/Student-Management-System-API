<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Student API</h1>
    <button onclick="showAddStudentForm()">Add Student</button>
    <div id="formContainer" style="display: none;">
        <form id="studentForm">
            <input type="hidden" id="studentId">
            <input type="text" id="studentName" placeholder="Name" required>
            <input type="text" id="studentNumber" placeholder="Student Number" required>
            <input type="text" id="studentProgram" placeholder="Program" required>
            <button type="button" onclick="submitStudentForm()">Submit</button>
            <button type="button" onclick="hideForm()">Cancel</button>
        </form>
    </div>
    <div id="response"></div>
    <table id="studentsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Student Number</th>
                <th>Program</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
