<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Management</h1>
    </header>
    <div id="response"></div>
    <div class="add-student">
        <button id="addStudent" onclick="showAddStudentForm()">Add Student</button>
    </div>
    <div id="formContainer">
        <form id="studentForm" onsubmit="submitStudentForm(); return false;">
            <input type="hidden" id="studentId">
            <div>
                <label for="studentName">Name:</label>
                <input type="text" id="studentName" required>
            </div>
            <div>
                <label for="studentNumber">Student Number:</label>
                <input type="text" id="studentNumber" required>
            </div>
            <div>
                <label for="studentProgram">Program:</label>
                <input type="text" id="studentProgram" required>
            </div>
            <button type="submit">Submit</button>
            <button type="button" onclick="hideForm()">Cancel</button>
        </form>
    </div>
    <table id="studentsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Student Number</th>
                <th>Program</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Student rows will be inserted here by JavaScript -->
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
